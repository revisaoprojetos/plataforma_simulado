# =====================================================================
# STACK PORTAINER (Swarm) — App + PDF assíncrono (worker + Gotenberg) + Gerenciador de Vídeo (video-*)
# Usa IMAGENS PRONTAS do GHCR (buildadas pelo GitHub Actions). Swarm não builda.
#
# ANTES DE SUBIR:
#  1) O workflow .github/workflows/docker-publish.yml precisa ter rodado com sucesso
#     (publica as imagens web, worker E api no ghcr.io). Deixe os 3 pacotes PÚBLICOS
#     (GitHub → Packages → cada pacote → Package settings → Change visibility → Public),
#     senão o Swarm não consegue baixar.
#     RELATÓRIOS VIA API (strangler): para ligar, defina no Portainer as envs
#       API_INTERNAL_SECRET (segredo forte) e DATABASE_URL (string do pooler do Supabase).
#       RELATORIOS_API_URL já aponta para http://api:3001 por padrão. Sem essas envs, o web
#       cai no SQL local (se DATABASE_URL no web) ou no PostgREST (lento).
#  2) O schema do Supabase de produção já está aplicado — não rode migrations
#     como parte deste deploy (ver docs/deploy/runbook-vps.md).
#  3) Preencha as variáveis em "Environment variables" no Portainer (ver
#     docs/deploy/runbook-vps.md), incluindo TRAEFIK_NETWORK, TRAEFIK_CERTRESOLVER
#     e APP_BASE_DOMAIN — os defaults abaixo já refletem a stack Traefik real desta VPS
#     (rede `network_swarm_public`, resolver `letsencryptresolver`, base `revisaopge.com.br`).
#
# MULTI-TENANT POR SUBDOMÍNIO (curinga) — cada plataforma abre em `slug.<APP_BASE_DOMAIN>`.
# Para funcionar sem tocar na infra a cada tenant novo, é preciso 1x na VPS/DNS:
#   a) DNS: registro curinga `*.revisaopge.com.br` → IP da VPS (A/CNAME).
#   b) Traefik: o router já usa HostRegexp (abaixo) para casar qualquer subdomínio.
#   c) TLS: cert WILDCARD `*.revisaopge.com.br` — o certresolver do Traefik PRECISA usar
#      desafio DNS-01 (HTTP-01 não emite curinga). Configure no serviço do Traefik as
#      credenciais de API do provedor de DNS (ex.: Cloudflare: CF_DNS_API_TOKEN) e
#      `--certificatesresolvers.<nome>.acme.dnschallenge.provider=<provedor>`. Aponte
#      TRAEFIK_CERTRESOLVER para esse resolver DNS-01.
#
# Roteamento HTTPS é feito pelo Traefik já existente na VPS (rede externa
# TRAEFIK_NETWORK) — este compose não publica porta nenhuma diretamente.
#
# Todos os serviços desta stack rodam no node WORKER do Swarm (node.role ==
# worker) — o manager é reservado para o Traefik e outras stacks de infra.
# =====================================================================

x-video-logging: &video-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-video-app-env: &video-app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://video:${VIDEO_POSTGRES_PASSWORD:-}@video-postgres:5432/video
  # Reservado para o Prisma `directUrl` (Fase 1.11). Aqui é a mesma conexão (não há PgBouncer).
  DIRECT_URL: postgresql://video:${VIDEO_POSTGRES_PASSWORD}@video-postgres:5432/video
  REDIS_URL: redis://:${VIDEO_REDIS_PASSWORD:-}@video-redis:6379
  S3_ENDPOINT: ${VIDEO_S3_ENDPOINT:-https://hel1.your-objectstorage.com}
  S3_REGION: ${VIDEO_S3_REGION:-hel1}
  S3_BUCKET: ${VIDEO_S3_BUCKET:-revisaopge-videos}
  S3_ACCESS_KEY: ${VIDEO_S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${VIDEO_S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${VIDEO_S3_FORCE_PATH_STYLE:-false}
  METRICS_TOKEN: ${VIDEO_METRICS_TOKEN:-}

x-video-api-env: &video-api-env
  <<: *video-app-env
  JWT_ACCESS_SECRET: ${VIDEO_JWT_ACCESS_SECRET:-}
  JWT_REFRESH_SECRET: ${VIDEO_JWT_REFRESH_SECRET:-}
  JWT_ACCESS_TTL: ${VIDEO_JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${VIDEO_JWT_REFRESH_TTL:-7d}
  CORS_ORIGINS: ${VIDEO_CORS_ORIGINS:-}
  TRUST_PROXY: ${VIDEO_TRUST_PROXY:-1}
  # Publicada sob o domínio da plataforma em /video-api (ver labels do `api`): a chave AES dentro do manifesto leva o prefixo.
  PUBLIC_PATH_PREFIX: ${VIDEO_PUBLIC_PATH_PREFIX:-/video-api}
  RATE_LIMIT_ENABLED: "true"
  SWAGGER_ENABLED: ${VIDEO_SWAGGER_ENABLED:-false}
  ACCESS_ENDPOINT_ENABLED: ${VIDEO_ACCESS_ENDPOINT_ENABLED:-true}
  LOG_LEVEL: ${VIDEO_LOG_LEVEL:-info}
  MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-10737418240}
  MAX_CONCURRENT_STREAMS: ${VIDEO_MAX_CONCURRENT_STREAMS:-2}
  PLAYBACK_TOKEN_TTL: ${VIDEO_PLAYBACK_TOKEN_TTL:-5m}
  HLS_SEGMENT_URL_TTL: ${VIDEO_HLS_SEGMENT_URL_TTL:-1h}

services:
  # App Next.js — UI, enfileira PDFs e serve as páginas /imprimir
  web:
    image: ghcr.io/revisaoprojetos/plataforma_simulado:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - PDF_RENDER_SECRET=${PDF_RENDER_SECRET}
      # Storage (Hetzner S3). Ativa SÓ quando STORAGE_PROVIDER=s3 no stack; default 'supabase' mantém tudo como está.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-supabase}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET_PREFIX=${S3_BUCKET_PREFIX}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}
      - STORAGE_CONTENT_BUCKET=${STORAGE_CONTENT_BUCKET:-pdfs}
      - STORAGE_IMAGE_BUCKET=${STORAGE_IMAGE_BUCKET:-imagens}
      # Migração S3: com s3, o que ainda não foi copiado p/ o Hetzner é lido do Supabase (off = desliga).
      - STORAGE_FALLBACK_SUPABASE=${STORAGE_FALLBACK_SUPABASE:-on}
      - PDF_PUBLIC_BASE=${PDF_PUBLIC_BASE}
      - WEB_INTERNAL_URL=http://web:3000
      - CRON_SECRET=${CRON_SECRET}
      # Domínios custom extras p/ server actions (next.config lê em runtime; os 2 conhecidos já estão no código).
      - SERVER_ACTION_ORIGINS=${SERVER_ACTION_ORIGINS:-}
      # Criptografa em repouso os segredos no banco (credenciais Curseduca por tenant).
      # FIXE este valor e NUNCA troque: se mudar, as credenciais salvas ficam ilegíveis e a integração
      # "some". Ao precisar rotacionar, mova a chave antiga para APP_ENCRYPTION_KEY_OLD (lista separada por
      # vírgula) — a descriptografia tenta a atual e depois as antigas, sem órfãs.
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - APP_ENCRYPTION_KEY_OLD=${APP_ENCRYPTION_KEY_OLD}
      # Assina/verifica os JWTs de sessão do portal do aluno (evita acoplar a validade
      # da sessão à SUPABASE_SERVICE_ROLE_KEY, usada como fallback se ausente)
      - ALUNO_SESSION_SECRET=${ALUNO_SESSION_SECRET}
      # Opcional: tenant que pode usar as credenciais Curseduca do .env (os demais usam o banco)
      - CURSEDUCA_ENV_TENANT_ID=${CURSEDUCA_ENV_TENANT_ID}
      # Relatórios (strangler): com RELATORIOS_API_URL setado, o web busca os relatórios pesados na
      # API NestJS (serviço `api` abaixo) em vez de rodar SQL/PostgREST localmente. Segredo compartilhado.
      - RELATORIOS_API_URL=${RELATORIOS_API_URL:-http://api:3001}
      - API_INTERNAL_SECRET=${API_INTERNAL_SECRET}
      # DATABASE_URL (pooler do Supabase) habilita o caminho SQL DIRETO como fallback — já evita o
      # fetchAll do PostgREST nos relatórios quando a API estiver fora. Sem ela, cai no PostgREST.
      - DATABASE_URL=${DATABASE_URL}
      - REPORT_SQL=${REPORT_SQL:-on}
      # OnlyOffice (Biblioteca de Conteúdos: editor docx + prévia fiel + CAPA do card via ConvertService).
      #  - NEXT_PUBLIC_ONLYOFFICE_URL: URL PÚBLICA do Document Server (o NAVEGADOR carrega o api.js daqui) —
      #    lida no servidor em runtime, então basta setar aqui (sem rebuild da imagem).
      #  - CONTEUDO_WOPI_HOST: URL por onde o Document Server alcança ESTE app (callback de save). Use a
      #    PÚBLICA (https) p/ evitar o bloqueio de IP privado do OnlyOffice (SSRF guard). O callback resolve
      #    o tenant pela versão, então qualquer host que roteie pro app serve.
      #  - ONLYOFFICE_INTERNAL_URL: URL INTERNA (web→DS) usada só p/ gerar a capa (ConvertService), na rede do swarm.
      # NEXT_PUBLIC_ONLYOFFICE_URL é DERIVADO do ONLYOFFICE_HOST (uma fonte só de verdade) → basta setar
      # ONLYOFFICE_HOST. `https://${VAR:-default}` é substituição simples (sem ${} aninhado = sem bug).
      - NEXT_PUBLIC_ONLYOFFICE_URL=https://${ONLYOFFICE_HOST:-onlyoffice.revisaopge.com.br}
      - CONTEUDO_WOPI_HOST=${CONTEUDO_WOPI_HOST:-https://simulado.revisaopge.com.br}
      - ONLYOFFICE_INTERNAL_URL=${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
      # Segredo HMAC dos access_token das rotas /api/teste/* (OnlyOffice/WOPI/plugin). Opcional: sem ele deriva de APP_ENCRYPTION_KEY.
      - ONLYOFFICE_ACCESS_SECRET=${ONLYOFFICE_ACCESS_SECRET:-}
    networks:
      - default
      - traefik
    # Healthcheck LEVE (sem DB) — serve de gate p/ o start-first/rollback: o Swarm só promove a task
    # nova quando o app responde 200 em /api/health; se não ficar saudável, reverte (não derruba o aluno).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    deploy:
      replicas: 1
      # Deploy SEGURO (sem downtime): sobe a task NOVA antes de derrubar a antiga (start-first) e, se a
      # nova não ficar saudável (imagem ruim/inexistente/crash), REVERTE p/ a anterior automaticamente.
      # Isso evita o "404 do Traefik" que acontece com o stop-first padrão quando a imagem não sobe.
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 45s
        max_failure_ratio: 0
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-network_swarm_public}"
        # Roteamento CURINGA: entrega QUALQUER subdomínio do domínio base a esta app —
        # cada tenant é um subdomínio `slug.<base>`, então plataformas novas abrem sem mexer na infra.
        # Sintaxe Traefik v2 (named group). Em Traefik v3 troque por Go regexp:
        #   HostRegexp(`^[a-z0-9-]+\.revisaopge\.com\.br$`)
        - "traefik.http.routers.plataforma-simulado.rule=HostRegexp(`{sub:[a-z0-9-]+}.${APP_BASE_DOMAIN:-revisaopge.com.br}`)"
        # Prioridade baixa: por ser catch-all, deixa qualquer serviço com Host() explícito
        # (mesmo domínio) vencer o roteamento; esta app é o fallback dos subdomínios de tenant.
        - "traefik.http.routers.plataforma-simulado.priority=1"
        - "traefik.http.routers.plataforma-simulado.entrypoints=websecure"
        - "traefik.http.routers.plataforma-simulado.tls=true"
        - "traefik.http.routers.plataforma-simulado.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptresolver}"
        # Cert WILDCARD (*.base) para cobrir todos os subdomínios de uma vez. EXIGE que o
        # certresolver use desafio DNS-01 (HTTP-01 não emite curinga) — ver nota no topo.
        - "traefik.http.routers.plataforma-simulado.tls.domains[0].main=${APP_BASE_DOMAIN:-revisaopge.com.br}"
        - "traefik.http.routers.plataforma-simulado.tls.domains[0].sans=*.${APP_BASE_DOMAIN:-revisaopge.com.br}"
        - "traefik.http.services.plataforma-simulado.loadbalancer.server.port=3000"
        # ── Domínios PRÓPRIOS de tenant (FORA de *.${APP_BASE_DOMAIN}) ───────────────────────────
        # O HostRegexp acima só alcança subdomínios do domínio BASE. Um tenant com domínio próprio
        # (ex.: simulado.vocenadefensoria.com.br) NÃO casa lá → 404 do Traefik. Precisa desta rota
        # EXPLÍCITA. TEM que ficar AQUI (na stack), não só num label manual do Portainer — senão o
        # próximo re-deploy da stack apaga e o domínio cai. Vários: `Host(`a`) || Host(`b`)` na env.
        # Prioridade > catch-all (1) para vencer. Cert individual via HTTP-01 (o wildcard só cobre a base).
        - "traefik.http.routers.plataforma-simulado-custom.rule=${APP_CUSTOM_HOSTS_RULE:-Host(`simulado.vocenadefensoria.com.br`) || Host(`simulado.meqconcursos.com.br`)}"
        - "traefik.http.routers.plataforma-simulado-custom.priority=10"
        - "traefik.http.routers.plataforma-simulado-custom.entrypoints=websecure"
        - "traefik.http.routers.plataforma-simulado-custom.tls=true"
        - "traefik.http.routers.plataforma-simulado-custom.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptresolver}"
        - "traefik.http.routers.plataforma-simulado-custom.service=plataforma-simulado"

  # API NestJS (relatórios pesados — strangler). INTERNA: sem Traefik; o web a alcança por
  # http://api:3001 na rede `default`. Roda o SQL de relatório fora do web, aliviando-o.
  api:
    image: ghcr.io/revisaoprojetos/plataforma_simulado-api:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      # Segredo compartilhado com o web (header x-api-secret). Gere um valor forte no Portainer.
      - API_INTERNAL_SECRET=${API_INTERNAL_SECRET}
      # DATABASE_URL = string do POOLER (Supavisor/PgBouncer) do Supabase — Postgres direto p/ o SQL
      # de relatório. Opcional: DATABASE_URL_REPLICA (read-replica só-leitura), DATABASE_POOL_MAX.
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-5}
      - REPORT_SQL=${REPORT_SQL:-on}
      # Mesma chave do web (caso a API venha a ler segredos criptografados). Fixe e nunca troque.
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - APP_ENCRYPTION_KEY_OLD=${APP_ENCRYPTION_KEY_OLD}
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker

  # Consome a fila, chama o Gotenberg, sobe o PDF no bucket `pdfs`
  worker:
    image: ghcr.io/revisaoprojetos/plataforma_simulado-worker:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - GOTENBERG_URL=http://gotenberg:3000
      - WEB_INTERNAL_URL=http://web:3000
      # Auto-encerramento: mesmo valor do CRON_SECRET do web (worker chama /api/cron/encerrar-expirados a cada 60s)
      - CRON_SECRET=${CRON_SECRET}
      # Mesma chave do web (o worker pode decriptar segredos ao rodar jobs/sync). Fixe e nunca troque.
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - APP_ENCRYPTION_KEY_OLD=${APP_ENCRYPTION_KEY_OLD}
      # Storage (Hetzner S3). O worker gera PDFs → precisa das MESMAS envs do web. Default 'supabase' até o flip.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-supabase}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET_PREFIX=${S3_BUCKET_PREFIX}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}
      # PDF_PUBLIC_BASE é opcional: sem ela, o worker usa o getPublicUrl do provider ativo (Supabase ou S3).
      - PDF_PUBLIC_BASE=${PDF_PUBLIC_BASE}
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker

  # Motor de PDF (Chromium embutido) — renderiza /imprimir fora do app
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-allow-list=.*
      - --api-timeout=120s
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker

  # Fila (compartilhada web=produtor / worker=consumidor)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker

  # =====================================================================
  # GERENCIADOR DE VÍDEO (services/video) — MESMA STACK. Serviços com prefixo `video-`.
  # Imagens: plataforma_simulado-video-api / -video-worker (tag VIDEO_TAG = SHA completo; independente de IMAGE_TAG).
  # Variáveis do vídeo têm prefixo VIDEO_ (a stack já usa S3_*): ver services/video/.env.video.example.
  # Postgres/Redis DEDICADOS (heartbeats não vão ao Supabase). Web fala com a API em http://video-api:3000
  # (URL gravada em /super/video); o navegador usa <domínio da plataforma>/video-api (Traefik, sem DNS novo).
  # Rótulos de nó: video-worker=true (ffmpeg) e video-data=true (volumes do Postgres/Redis).
  # =====================================================================
  # ------------------------------------------------------------------
  # API NestJS — stateless, N réplicas. Heartbeats só enfileiram no Redis (consolidação fica no consolidator).
  # ------------------------------------------------------------------
  video-api:
    image: ghcr.io/${GHCR_OWNER:-revisaoprojetos}/plataforma_simulado-video-api:${VIDEO_TAG:-sem-tag}
    init: true
    environment:
      <<: *video-api-env
      PORT: "3000"
      PROGRESS_FLUSH_INTERVAL_MS: "0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - video_internal
      - default
      - traefik
    logging: *video-logging
    stop_grace_period: 30s
    # O HEALTHCHECK padrão da imagem (/health/live) vale aqui; o Swarm só promove a task nova quando saudável.
    deploy:
      replicas: ${VIDEO_API_REPLICAS:-0}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 45s
        max_failure_ratio: 0
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-network_swarm_public}"
        # MESMO DOMÍNIO DA PLATAFORMA: qualquer host que já chega neste Traefik (subdomínios de tenant, domínios
        # próprios, iframe da Curseduca) expõe o serviço em <host>/video-api/*. O prefixo é removido antes de chegar
        # na API (ela continua em /v1/...). Sem DNS novo, sem CORS (mesma origem) e sem emitir certificado aqui:
        # o TLS é o dos routers da plataforma (por isso NÃO há certresolver neste router).
        # Prioridade 25 > routers da plataforma (1 e 10), senão o catch-all do web engoliria o /video-api.
        - "traefik.http.routers.video-api.rule=PathPrefix(`/video-api`)"
        - "traefik.http.routers.video-api.priority=25"
        - "traefik.http.routers.video-api.entrypoints=websecure"
        - "traefik.http.routers.video-api.tls=true"
        - "traefik.http.routers.video-api.middlewares=video-api-strip"
        - "traefik.http.routers.video-api.service=video-api"
        - "traefik.http.services.video-api.loadbalancer.server.port=3000"
        - "traefik.http.middlewares.video-api-strip.stripprefix.prefixes=/video-api"
        # MCP desligado (decisão D4) e /metrics só pela rede interna: caminhos bloqueados na borda.
        # ipwhitelist com 127.0.0.1/32 => 403 para qualquer cliente externo (v2 e v3; em v3 é o nome legado de ipallowlist).
        - "traefik.http.middlewares.video-api-deny.ipwhitelist.sourcerange=127.0.0.1/32"
        - "traefik.http.routers.video-api-bloqueados.rule=PathPrefix(`/video-api/mcp`) || PathPrefix(`/video-api/metrics`)"
        - "traefik.http.routers.video-api-bloqueados.priority=30"
        - "traefik.http.routers.video-api-bloqueados.entrypoints=websecure"
        - "traefik.http.routers.video-api-bloqueados.tls=true"
        - "traefik.http.routers.video-api-bloqueados.middlewares=video-api-deny"
        - "traefik.http.routers.video-api-bloqueados.service=video-api"

  # ------------------------------------------------------------------
  # Consolidador — mesmo código da API, outro entrypoint: grava no Postgres os heartbeats enfileirados no Redis.
  # ------------------------------------------------------------------
  video-consolidator:
    image: ghcr.io/${GHCR_OWNER:-revisaoprojetos}/plataforma_simulado-video-api:${VIDEO_TAG:-sem-tag}
    init: true
    command: ["node", "apps/api/dist/consolidator.main.js"]
    environment:
      <<: *video-api-env
      PROGRESS_FLUSH_INTERVAL_MS: "2000"
      CONSOLIDATOR_PORT: "9102"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - video_internal
    logging: *video-logging
    stop_grace_period: 60s # esvazia a fila de heartbeats antes de sair
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${VIDEO_CONSOLIDATOR_REPLICAS:-0}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
      placement:
        constraints:
          - node.role == worker

  # ------------------------------------------------------------------
  # Worker de transcode (ffmpeg) — CPU-bound; roda só no(s) nó(s) rotulado(s) video-worker=true.
  # ------------------------------------------------------------------
  video-worker:
    image: ghcr.io/${GHCR_OWNER:-revisaoprojetos}/plataforma_simulado-video-worker:${VIDEO_TAG:-sem-tag}
    init: true
    environment:
      <<: *video-app-env
      METRICS_PORT: "9100"
      WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
      FFMPEG_PRESET: ${VIDEO_FFMPEG_PRESET:-veryfast}
      FFMPEG_THREADS: ${VIDEO_FFMPEG_THREADS:-0}
      # Tempo máximo do JOB inteiro (download + qualidades + upload). 3 h.
      JOB_TIMEOUT_MS: ${VIDEO_JOB_TIMEOUT_MS:-10800000}
      # lockDuration/stalledInterval: um worker morto à força (OOM/SIGKILL) tem o job retomado em ~90 s.
      WORKER_LOCK_DURATION_MS: ${VIDEO_WORKER_LOCK_DURATION_MS:-60000}
      WORKER_STALLED_INTERVAL_MS: ${VIDEO_WORKER_STALLED_INTERVAL_MS:-30000}
      WORKER_MAX_STALLED_COUNT: ${VIDEO_WORKER_MAX_STALLED_COUNT:-2}
      # SIGTERM: espera até 2 min os jobs terminarem; depois mata o ffmpeg e DEVOLVE o job à fila (sem gastar tentativa).
      # Teto de saída = drain + 90 s, sempre menor que o stop_grace_period abaixo.
      SHUTDOWN_DRAIN_MS: ${VIDEO_SHUTDOWN_DRAIN_MS:-120000}
      WORK_DIR: /tmp
      MIN_FREE_DISK_BYTES: ${VIDEO_MIN_FREE_DISK_BYTES:-2147483648}
      DISK_SPACE_FACTOR: ${VIDEO_DISK_SPACE_FACTOR:-2.5}
    read_only: true
    cap_drop:
      - ALL
    volumes:
      # Originais (GBs) e saída HLS: precisam de DISCO, não de RAM (por isso volume, não tmpfs).
      - video_worker_tmp:/tmp
    networks:
      - video_internal
    logging: *video-logging
    stop_grace_period: 10m
    deploy:
      replicas: ${VIDEO_WORKER_REPLICAS:-0}
      update_config:
        parallelism: 1
        # stop-first: nunca dois ffmpeg disputando a mesma CPU/disco durante o deploy.
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: "${VIDEO_WORKER_CPUS:-4}"
          memory: ${VIDEO_WORKER_MEMORY:-3G}
        reservations:
          cpus: "1.0"
          memory: 512M
      placement:
        constraints:
          - node.labels.video-worker == true

  # ------------------------------------------------------------------
  # Migrations — JOB DE EXECUÇÃO ÚNICA. Mesma imagem da API (tem a CLI do Prisma). Ver instruções no topo.
  # ------------------------------------------------------------------
  video-migrate:
    image: ghcr.io/${GHCR_OWNER:-revisaoprojetos}/plataforma_simulado-video-api:${VIDEO_TAG:-sem-tag}
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://video:${VIDEO_POSTGRES_PASSWORD}@video-postgres:5432/video
      DIRECT_URL: postgresql://video:${VIDEO_POSTGRES_PASSWORD}@video-postgres:5432/video
    # O HEALTHCHECK da imagem é da API (porta 3000) e não se aplica a um job.
    healthcheck:
      disable: true
    cap_drop:
      - ALL
    networks:
      - video_internal
    logging: *video-logging
    deploy:
      replicas: ${VIDEO_INFRA_REPLICAS:-0}
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 512M
      placement:
        constraints:
          - node.role == worker

  # ------------------------------------------------------------------
  # Postgres dedicado (heartbeats não vão ao Supabase). Dados em volume LOCAL => fixado no nó video-data=true.
  # Backup: apps/api/scripts/backup-pg.sh (cron do host) — ver RUNBOOK §6.
  # ------------------------------------------------------------------
  video-postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=${VIDEO_PG_SHARED_BUFFERS:-256MB}"]
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${VIDEO_POSTGRES_PASSWORD:-}
      POSTGRES_DB: video
    volumes:
      - video_pgdata:/var/lib/postgresql/data
    networks:
      - video_internal
    logging: *video-logging
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: ${VIDEO_INFRA_REPLICAS:-0}
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
      placement:
        constraints:
          - node.labels.video-data == true

  # ------------------------------------------------------------------
  # Redis dedicado: fila de transcode + heartbeats. noeviction (nunca descartar fila) + AOF.
  # ------------------------------------------------------------------
  video-redis:
    image: redis:7-alpine
    # Senha lida do ambiente pelo shell (não aparece na lista de argumentos do serviço).
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory ${VIDEO_REDIS_MAXMEMORY:-1gb} --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${VIDEO_REDIS_PASSWORD:-}
    volumes:
      - video_redisdata:/data
    networks:
      - video_internal
    logging: *video-logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: ${VIDEO_INFRA_REPLICAS:-0}
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 128M
      placement:
        constraints:
          - node.labels.video-data == true

  # =====================================================================
  # OnlyOffice Document Server — editor .docx + prévia fiel + CAPA do card da Biblioteca de Conteúdos.
  # ANTES DE SUBIR / APÓS SUBIR:
  #  1) DNS: `onlyoffice.${APP_BASE_DOMAIN}` → IP da VPS (o cert WILDCARD `*.${APP_BASE_DOMAIN}` já cobre).
  #  2) Pesado: ~2 GB RAM + volumes persistentes. Confira a folga da VPS.
  #  3) ⚠️ SEGURANÇA: está com JWT_ENABLED=false porque o editor da Biblioteca ainda NÃO assina a config.
  #     Um Document Server público SEM JWT é um proxy de conversão aberto. Ligue o JWT assim que o editor
  #     assinar a config (peça a implementação). Enquanto isso, considere restringir por IP no Traefik.
  #  4) SSRF guard do OnlyOffice: bloqueia IP privado. Por isso CONTEUDO_WOPI_HOST é a URL PÚBLICA do app
  #     (o callback sai pela internet e volta via Traefik) — assim NÃO precisa editar o local.json.
  #  5) document.url das edições/capa = URL ASSINADA do Supabase (pública) → o DS baixa sem problema.
  onlyoffice:
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION:-latest}
    environment:
      - JWT_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    networks:
      - default
      - traefik
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-network_swarm_public}"
        # ONLYOFFICE_HOST = hostname público do Document Server. Default usa o subdomínio do domínio base
        # (exige registro DNS). SEM acesso ao DNS? Use sslip.io (sem cadastro): defina no Portainer
        #   ONLYOFFICE_HOST=onlyoffice.46-224-161-181.sslip.io  (troque pelos octetos do IP da VPS com "-")
        # e NEXT_PUBLIC_ONLYOFFICE_URL=https://onlyoffice.46-224-161-181.sslip.io
        - "traefik.http.routers.onlyoffice.rule=Host(`${ONLYOFFICE_HOST:-onlyoffice.revisaopge.com.br}`)"
        # Prioridade > catch-all (1) da app, p/ este Host() explícito vencer o roteamento.
        - "traefik.http.routers.onlyoffice.priority=20"
        - "traefik.http.routers.onlyoffice.entrypoints=websecure"
        - "traefik.http.routers.onlyoffice.tls=true"
        # Cert por HOST (não wildcard) → funciona tanto p/ subdomínio real quanto p/ sslip.io. Exige que o
        # certresolver consiga desafio HTTP-01 (porta 80 do Traefik aberta). Se o resolver for só DNS-01,
        # o cert do sslip.io falha → aí o caminho é o DNS mesmo (registro A na conta Cloudflare do domínio).
        - "traefik.http.services.onlyoffice.loadbalancer.server.port=80"

networks:
  default:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-network_swarm_public}
  # Rede interna do vídeo: Postgres/Redis/worker/consolidador só existem aqui. NÃO é `internal` (S3 pelo gateway).
  # `attachable` permite backup/restore pontual e o Prometheus entrarem nela.
  video_internal:
    name: ${VIDEO_INTERNAL_NETWORK:-video_internal}
    driver: overlay
    attachable: true

volumes:
  redis_data:
  video_pgdata:
  video_redisdata:
  video_worker_tmp:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_lib:
  onlyoffice_db:
