# =====================================================================
# STACK PORTAINER (Swarm) — App + PDF assíncrono (worker + Gotenberg)
# Usa IMAGENS PRONTAS do GHCR (buildadas pelo GitHub Actions). Swarm não builda.
#
# ANTES DE SUBIR:
#  1) O workflow .github/workflows/docker-publish.yml precisa ter rodado com sucesso
#     (publica as imagens web e worker no ghcr.io). Deixe os 2 pacotes PÚBLICOS
#     (GitHub → Packages → cada pacote → Package settings → Change visibility → Public),
#     senão o Swarm não consegue baixar.
#  2) O schema do Supabase de produção já está aplicado — não rode migrations
#     como parte deste deploy (ver docs/deploy/runbook-vps.md).
#  3) Preencha as variáveis em "Environment variables" no Portainer (ver
#     docs/deploy/runbook-vps.md), incluindo TRAEFIK_NETWORK, TRAEFIK_CERTRESOLVER
#     e APP_BASE_DOMAIN — os defaults abaixo já refletem a stack Traefik real desta VPS
#     (rede `network_swarm_public`, resolver `letsencryptresolver`, base `revisaopge.com.br`).
#
# MULTI-TENANT POR SUBDOMÍNIO (curinga) — cada plataforma abre em `slug.<APP_BASE_DOMAIN>`.
# Para funcionar sem tocar na infra a cada tenant novo, é preciso 1x na VPS/DNS:
#   a) DNS: registro curinga `*.revisaopge.com.br` → IP da VPS (A/CNAME).
#   b) Traefik: o router já usa HostRegexp (abaixo) para casar qualquer subdomínio.
#   c) TLS: cert WILDCARD `*.revisaopge.com.br` — o certresolver do Traefik PRECISA usar
#      desafio DNS-01 (HTTP-01 não emite curinga). Configure no serviço do Traefik as
#      credenciais de API do provedor de DNS (ex.: Cloudflare: CF_DNS_API_TOKEN) e
#      `--certificatesresolvers.<nome>.acme.dnschallenge.provider=<provedor>`. Aponte
#      TRAEFIK_CERTRESOLVER para esse resolver DNS-01.
#
# Roteamento HTTPS é feito pelo Traefik já existente na VPS (rede externa
# TRAEFIK_NETWORK) — este compose não publica porta nenhuma diretamente.
#
# Todos os serviços desta stack rodam no node WORKER do Swarm (node.role ==
# worker) — o manager é reservado para o Traefik e outras stacks de infra.
# =====================================================================

services:
  # App Next.js — UI, enfileira PDFs e serve as páginas /imprimir
  web:
    image: ghcr.io/revisaoprojetos/plataforma_simulado:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - PDF_RENDER_SECRET=${PDF_RENDER_SECRET}
      - WEB_INTERNAL_URL=http://web:3000
      - CRON_SECRET=${CRON_SECRET}
      # Criptografa em repouso os segredos no banco (credenciais Curseduca por tenant)
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      # Assina/verifica os JWTs de sessão do portal do aluno (evita acoplar a validade
      # da sessão à SUPABASE_SERVICE_ROLE_KEY, usada como fallback se ausente)
      - ALUNO_SESSION_SECRET=${ALUNO_SESSION_SECRET}
      # Opcional: tenant que pode usar as credenciais Curseduca do .env (os demais usam o banco)
      - CURSEDUCA_ENV_TENANT_ID=${CURSEDUCA_ENV_TENANT_ID}
    networks:
      - default
      - traefik
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-network_swarm_public}"
        # Roteamento CURINGA: entrega QUALQUER subdomínio do domínio base a esta app —
        # cada tenant é um subdomínio `slug.<base>`, então plataformas novas abrem sem mexer na infra.
        # Sintaxe Traefik v2 (named group). Em Traefik v3 troque por Go regexp:
        #   HostRegexp(`^[a-z0-9-]+\.revisaopge\.com\.br$`)
        - "traefik.http.routers.plataforma-simulado.rule=HostRegexp(`{sub:[a-z0-9-]+}.${APP_BASE_DOMAIN:-revisaopge.com.br}`)"
        # Prioridade baixa: por ser catch-all, deixa qualquer serviço com Host() explícito
        # (mesmo domínio) vencer o roteamento; esta app é o fallback dos subdomínios de tenant.
        - "traefik.http.routers.plataforma-simulado.priority=1"
        - "traefik.http.routers.plataforma-simulado.entrypoints=websecure"
        - "traefik.http.routers.plataforma-simulado.tls=true"
        - "traefik.http.routers.plataforma-simulado.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptresolver}"
        # Cert WILDCARD (*.base) para cobrir todos os subdomínios de uma vez. EXIGE que o
        # certresolver use desafio DNS-01 (HTTP-01 não emite curinga) — ver nota no topo.
        - "traefik.http.routers.plataforma-simulado.tls.domains[0].main=${APP_BASE_DOMAIN:-revisaopge.com.br}"
        - "traefik.http.routers.plataforma-simulado.tls.domains[0].sans=*.${APP_BASE_DOMAIN:-revisaopge.com.br}"
        - "traefik.http.services.plataforma-simulado.loadbalancer.server.port=3000"

  # Consome a fila, chama o Gotenberg, sobe o PDF no bucket `pdfs`
  worker:
    image: ghcr.io/revisaoprojetos/plataforma_simulado-worker:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - GOTENBERG_URL=http://gotenberg:3000
      - WEB_INTERNAL_URL=http://web:3000
      # Auto-encerramento: mesmo valor do CRON_SECRET do web (worker chama /api/cron/encerrar-expirados a cada 60s)
      - CRON_SECRET=${CRON_SECRET}
      # PDF_PUBLIC_BASE é opcional: sem ela, o worker usa o getPublicUrl do Supabase.
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker

  # Motor de PDF (Chromium embutido) — renderiza /imprimir fora do app
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-allow-list=.*
      - --api-timeout=120s
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker

  # Fila (compartilhada web=produtor / worker=consumidor)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker

networks:
  default:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-network_swarm_public}

volumes:
  redis_data:
