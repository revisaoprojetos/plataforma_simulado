  function sig(ph){ try{ parent.postMessage({type:'estudio-nav',phase:ph},'*'); }catch(e){} }
  function pick(doc){
    var t=doc.getElementById('tpl'), c='';
    var ss=doc.querySelectorAll('script');
    for(var i=0;i<ss.length;i++){ if(!ss[i].src && ss[i].textContent.indexOf('window.Component')>=0) c=ss[i].textContent; }
    return {tpl: t?t.innerHTML:null, comp:c};
  }
  function swap(url){
    if(busy) return; busy=true; sig('start');
    fetch(url,{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){
      var doc=new DOMParser().parseFromString(h,'text/html'); var p=pick(doc);
      if(p.tpl==null||!p.comp){ busy=false; sig('done'); return; }
      document.getElementById('tpl').innerHTML=p.tpl;
      (0,eval)(p.comp);
      window.DCRuntime.start();
      window.scrollTo(0,0); busy=false; sig('done');
    }).catch(function(){ busy=false; sig('done'); });
  }
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null; if(!a) return;
    if(a.target==='_blank') return;
    var href=a.getAttribute('href')||'';
    if(href.charAt(0)==='#'||/^[a-z]+:/i.test(href)) return;
    if(!/\.html(\?|#|$)/.test(href)) return;
    e.preventDefault(); e.stopPropagation(); swap(href.split('#')[0].split('?')[0]);
  },true);
})();
</script>
</body>
</html>
