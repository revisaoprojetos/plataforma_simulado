name: Build e Push para GHCR

on:
  push:
    # Build em QUALQUER branch — assim dá para testar uma branch no Portainer (colando a imagem
    # por SHA) ANTES de mergear na main. O `latest` e o deploy automático só acontecem na main
    # (produção fica intacta enquanto você trabalha na branch).
    branches: ['**']
  # Permite disparar o build manualmente pela aba Actions (Run workflow) — útil quando um push
  # nao dispara o CI (ex.: push via URL antigo apos o repo ser renomeado).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Pacote deste repositório (o token só tem permissão de escrita no pacote do próprio repo).
  IMAGE_NAME: plataforma_simulado

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar owner para minúsculas (GHCR exige)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Definir tags (SHA sempre; `latest` SÓ na main)
        id: tags
        run: |
          BASE="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}"
          # Toda imagem sempre ganha a tag por SHA (é o que você cola no Portainer p/ deployar).
          web="${BASE}:${GITHUB_SHA}"
          wk="${BASE}-worker:${GITHUB_SHA}"
          api="${BASE}-api:${GITHUB_SHA}"
          # Só a main atualiza o `latest` (produção) — branches NÃO mexem no `latest`.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            web="${web}"$'\n'"${BASE}:latest"
            wk="${wk}"$'\n'"${BASE}-worker:latest"
            api="${api}"$'\n'"${BASE}-api:latest"
          fi
          { echo "web<<EOF"; echo "$web"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "wk<<EOF"; echo "$wk"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "api<<EOF"; echo "$api"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push (app Next.js — apps/web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=https://simulado.revisaopge.com.br
            NEXT_PUBLIC_COOKIE_DOMAIN=${{ secrets.NEXT_PUBLIC_COOKIE_DOMAIN || '.revisaopge.com.br' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push (worker BullMQ — apps/worker)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.wk }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push (API NestJS — apps/api)
        # A API é Fase 3 (skeleton, ainda NÃO deployada). Se o build dela falhar, NÃO pode
        # bloquear as imagens web/worker (que são o que roda em produção). Sobe quando der.
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          # context = raiz do monorepo (o Dockerfile copia packages/data + apps/api).
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy automático no Portainer (SÓ na main, se o webhook estiver configurado)
        # Auto-deploy sem colar SHA na mão: o Portainer re-pulla a tag `latest` e reinicia o serviço.
        # Pré-requisitos (feitos 1x): (1) serviço web apontando para `:latest`; (2) webhook do serviço
        # criado no Portainer; (3) a URL do webhook salva no secret PORTAINER_WEBHOOK do repositório.
        # Sem o secret, este passo é um no-op (deploy segue manual). Branches NUNCA disparam (só a main).
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Disparando redeploy no Portainer (re-pull da :latest + restart do serviço)…"
            curl -fsSL -X POST "$HOOK"
            echo "OK — Portainer vai puxar a imagem nova e reiniciar o serviço."
          else
            echo "PORTAINER_WEBHOOK ausente — pulando auto-deploy (deploy manual pelo Portainer)."
          fi

  deploy:
    needs: build-and-push
    # Deploy automático (docker service update → `latest`) SÓ na main. Uma branch nunca dispara
    # deploy — você a testa colando a imagem por SHA no Portainer, sem afetar produção.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Pula o deploy inteiro se o VPS não estiver configurado (evita falhar o workflow).
      - name: Verificar configuração do VPS
        id: vps
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS não configurado (secret VPS_HOST ausente) — pulando deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar SSH
        if: steps.vps.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Atualizar serviço no VPS
        if: steps.vps.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker service update \
              --force \
              --image ghcr.io/revisaoprojetos/plataforma_simulado:latest \
              --env-add 'SUPABASE_URL=${{ secrets.SUPABASE_URL }}' \
              --env-add 'SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
              --env-add 'SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}' \
              ${{ secrets.VPS_SERVICE || 'plataforma_simulado_app' }}"
