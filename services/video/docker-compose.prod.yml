# Produção. Use sempre com o arquivo de variáveis explícito:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Modelo das variáveis: .env.prod.example. Detalhes e runbook: docs/operacao.md.
#
# O TLS fica num proxy reverso à frente (Caddy/Nginx/Traefik) apontando para API_BIND;
# ajuste TRUST_PROXY (nº de proxies) para o IP real do cliente chegar ao limite de requisições.
name: gerenciador-video

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://video:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/video
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  networks: [backend]

services:
  postgres:
    <<: *hardened
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: video
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U video -d video']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só existe dentro da rede "backend".
    cap_drop: [] # o entrypoint do Postgres troca de usuário e precisa de CHOWN/SETUID/SETGID

  redis:
    <<: *hardened
    image: redis:7-alpine
    # noeviction: filas e heartbeats nunca podem ser descartados por falta de memória.
    # appendonly: a fila de progresso sobrevive a reinício.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    cap_drop: []

  # Aplica as migrations uma vez por deploy e termina. API e worker só sobem se ela terminar bem.
  migrate:
    image: gerenciador-video-api:build
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'prisma/schema.prisma']
    environment:
      DATABASE_URL: postgresql://video:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/video
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    networks: [backend]

  api:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.prod
    environment:
      <<: *app-env
      # A consolidação roda no serviço "consolidator", fora do processo que atende os jogadores.
      PROGRESS_FLUSH_INTERVAL_MS: '0'
    ports:
      - '${API_BIND:-127.0.0.1:3000}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    stop_grace_period: 20s # o consolidador esvazia a fila de heartbeats ao encerrar

  # Mesmo código da API com outro ponto de entrada: grava no Postgres os heartbeats que a API
  # enfileirou no Redis. Pode ter mais de uma réplica (travas por aluno/aula garantem consistência).
  consolidator:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/consolidator.main.js']
    env_file: .env.prod
    environment:
      <<: *app-env
      PROGRESS_FLUSH_INTERVAL_MS: '2000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    stop_grace_period: 30s # esvazia a fila antes de sair

  worker:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env.prod
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    # Os vídeos originais (GBs) são baixados e processados aqui: precisa de disco, não de RAM.
    volumes:
      - worker-tmp:/tmp
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 60s

networks:
  backend:

volumes:
  pgdata:
  redisdata:
  worker-tmp:
