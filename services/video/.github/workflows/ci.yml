name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: video
          POSTGRES_PASSWORD: video
          POSTGRES_DB: video
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U video" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://video:video@localhost:5432/video
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Migrations aplicam do zero
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t gv-api .
      - run: docker build -f apps/worker/Dockerfile -t gv-worker .
      - name: Compose de produção é válido
        run: |
          cp .env.prod.example .env.prod
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
