# Sobreposição SÓ para teste de carga (nunca em produção): permite muitas telas por aluno e expõe /metrics.
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d api
services:
  api:
    environment:
      MAX_CONCURRENT_STREAMS: '500'
      METRICS_TOKEN: carga-metrics-token-0123456789
      TRUST_PROXY: '1' # o k6 simula clientes distintos via X-Forwarded-For
      PROGRESS_FLUSH_INTERVAL_MS: '0' # a consolidação roda no serviço "consolidator"

  # Mesmo código da API, outro ponto de entrada: só consolida heartbeats.
  consolidator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/consolidator.main.js']
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://video:video@postgres:5432/video
      REDIS_URL: redis://redis:6379
      PROGRESS_FLUSH_INTERVAL_MS: '2000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
